services:
  app:
    build:
      context: ./application
    container_name: self-healing-demo
    restart: unless-stopped
    environment:
      APP_NAME: self-healing-demo
      APP_VERSION: "1.0.0"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - monitoring

  controller:
    build:
      context: ./incident-engine
    container_name: project8-controller
    restart: unless-stopped
    environment:
      APP_URL: http://app:8080
      AUTO_REMEDIATE: "true"
      COOLDOWN_SECONDS: "30"
      WEBHOOK_HOST: 0.0.0.0
      WEBHOOK_PORT: "8081"
    depends_on:
      - app
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: project8-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      - controller
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: project8-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
      - alertmanager
    networks:
      - monitoring

networks:
  monitoring:

volumes:
  prometheus-data:
  alertmanager-data:
