global:
  resolve_timeout: 1m

route:
  receiver: incident-controller
  group_by:
    - alertname
    - job
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: incident-controller
    webhook_configs:
      - url: http://controller:8081/alerts
        send_resolved: true
