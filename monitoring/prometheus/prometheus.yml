global:
  scrape_interval: 15s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/application-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: application
    metrics_path: /metrics
    static_configs:
      - targets:
          - "app:8080"

  - job_name: incident-controller
    metrics_path: /metrics
    static_configs:
      - targets:
          - "controller:8082"
